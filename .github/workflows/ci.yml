# Lint, typecheck, tests (TS + Rust), web build, gateway bundle, workflow
# lint, dependency audit and secret scan on every push and pull request.
# A green run on main triggers deploy.yml. Read-only token, no repository
# secrets; third-party actions pinned to commit SHAs.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  WRANGLER_SEND_METRICS: "false"

jobs:
  verify:
    name: verify (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: npm ci
      - name: npm run verify (lint, typecheck, TS tests, cargo fmt/clippy/test)
        run: npm run verify
      - name: Build apps/web (Cloudflare Pages layout)
        run: |
          npm run build -w apps/web
          npm run check:dist -w apps/web
      - name: Bundle the gateway (wrangler deploy --dry-run)
        working-directory: apps/gateway
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/gateway-bundle"

  workflows:
    name: workflow lint (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (checksum-verified release binary)
        run: |
          curl -sSfL -o actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz actionlint
          rm actionlint.tgz
      - name: Lint .github/workflows
        run: ./actionlint -color

  e2e:
    name: e2e (fake peer / libtorrent / Transmission -> wrangler dev / VPS gateway -> engine)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # The VPS gateway e2e (npm run e2e:vps) builds and runs services/seeders.
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: npm ci
      - name: Chromium for the browser session e2e (Playwright's build)
        run: npx playwright-core install --with-deps chromium
      - run: npm run e2e
        env:
          # The browser e2e enforces the billed-request budget: never skip it here.
          REQUIRE_BROWSER_E2E: "1"
          # uTP interop with libtorrent and Transmission (e2e:interop) runs
          # them in Docker (tools/e2e/interop/Dockerfile): never skip it here.
          REQUIRE_INTEROP_E2E: "1"
      # The synthetic phase numbers of this run (docs/measurements.md).
      - name: Keep the measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: measurements
          path: tools/e2e/results/
          if-no-files-found: ignore
          retention-days: 90

  dependencies:
    name: dependency audit (npm high+, cargo)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: npm audit (fails on high/critical not accepted in audit-allowlist.json)
        run: node scripts/audit-npm.mjs
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-audit
      - name: cargo audit (fails on any vulnerability advisory)
        run: cargo audit

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks (checksum-verified release binary)
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          rm gitleaks.tgz
      - name: Scan the working tree
        run: ./gitleaks dir . --redact --exit-code 1 --no-banner
      - name: Scan the git history
        run: ./gitleaks git . --redact --exit-code 1 --no-banner
