# Drop into e.g. /etc/nginx/sites-available/magnet-seeders, symlink into
# sites-enabled, then run certbot (see README) to add TLS.
#
# IMPORTANT: don't add `add_header Access-Control-Allow-Origin ...` (or
# any other CORS header) here, in a shared snippet, or in the surrounding
# http{} block that applies to this server{} — the app already sets CORS
# headers itself (via ALLOWED_ORIGINS), and a second copy from nginx
# produces duplicate headers that browsers reject outright.

server {
    listen 80;
    listen [::]:80;
    server_name peers.example.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Above the app's own per-route timeouts: /peers streams for ~30s,
        # /swarm ~15s, /metadata ~17s (a cold info-dict fetch from peers).
        proxy_connect_timeout 5s;
        proxy_read_timeout 40s;
        # The streamed /peers must reach the page line by line (the app
        # also sends X-Accel-Buffering: no).
        proxy_buffering off;
    }
}
