# nginx vhost for the "magnet-stream" install (next to the PoC's
# magnet-seeders vhost). Copy to /etc/nginx/sites-available/magnet-stream,
# set server_name, symlink into sites-enabled, then run certbot.
#
# IMPORTANT: don't add CORS headers (add_header Access-Control-...) here or
# in a shared snippet: the app sets them from ALLOWED_ORIGINS, and a second
# copy makes browsers reject the response.

server {
    listen 80;
    listen [::]:80;
    server_name magnet-stream.example.com;

    location / {
        # BIND_ADDR of /etc/magnet-stream/magnet-stream.env.
        proxy_pass http://127.0.0.1:8096;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The per-IP limits of /peers read this (CLIENT_IP_HEADER).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /peers streams for ~30 s (PEERS_STREAM_SECS).
        proxy_connect_timeout 5s;
        proxy_read_timeout 40s;
        # The streamed /peers must reach the page line by line (the app
        # also sends X-Accel-Buffering: no).
        proxy_buffering off;
    }
}
